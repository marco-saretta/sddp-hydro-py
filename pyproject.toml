[project]
name = "resddp-toy"
version = "0.1.0"
description = "A small Python re-implementation of the ReSDDP stage problem and SDDP loop, for learning"
requires-python = ">=3.12"
dependencies = [
    "highspy>=1.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resddp_toy"]
