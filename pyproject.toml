[project]
name = "sddp-hydro-py"
version = "0.1.0"
description = "Stochastic Dual Dynamic Programming (SDDP) for hydropower scheduling, configured with Hydra"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Marco Saretta", email = "mcsr@dtu.dk" }]
requires-python = ">=3.13"
dependencies = [
    "highspy>=1.10",
    "hydra-core>=1.3.2",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "omegaconf>=2.3",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sddp_hydro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["resources"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "SIM"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
